<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>DSH Edge Bridge · 常驻桥接页</title>
    <style>
      :root { color-scheme: light dark; }
      body { font: 13px/1.6 system-ui, "Segoe UI", "Microsoft YaHei", sans-serif; margin: 0; padding: 20px; }
      h1 { font-size: 16px; margin: 0 0 4px; }
      .muted { opacity: 0.7; }
      .row { display: flex; gap: 8px; align-items: center; margin: 10px 0; flex-wrap: wrap; }
      .pill { padding: 2px 10px; border-radius: 999px; font-size: 12px; background: #8883; }
      .pill.ok { background: #16a34a33; color: #15803d; }
      .pill.bad { background: #dc262633; color: #b91c1c; }
      .pill.wait { background: #f59e0b33; color: #b45309; }
      button { font: inherit; padding: 4px 12px; border-radius: 6px; border: 1px solid #8886; background: transparent; cursor: pointer; }
      button:hover { background: #8882; }
      #log { margin-top: 14px; border: 1px solid #8884; border-radius: 8px; padding: 10px; max-height: 320px; overflow: auto; font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
      #log div { border-bottom: 1px dashed #8883; padding: 2px 0; }
      code { background: #8882; padding: 0 4px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <h1>DSH Edge Bridge <span class="pill" id="state">…</span></h1>
    <div class="muted">
      这个页面是扩展的常驻桥接页：它自己维持一条到 DSH 插件的 WebSocket，比 service worker 更不容易被浏览器回收。
      可以固定（Pin）它，也可以关掉——关掉后仍由 service worker 连接，只是空闲后重连可能需要几秒。
    </div>
    <div class="row">
      <button id="reconnect">重新连接</button>
      <button id="clear">清空日志</button>
      <span class="muted" id="meta"></span>
    </div>
    <div id="log"></div>
    <script type="module" src="bridge-tab.js"></script>
  </body>
</html>
